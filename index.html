<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凱星牙醫｜休診公告產生器</title>
<link rel="stylesheet" href="https://font.emtech.cc/css/GenSenRoundedTW/400" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://font.emtech.cc/css/GenSenRoundedTW/700" media="print" onload="this.media='all'">
<noscript>
<link rel="stylesheet" href="https://font.emtech.cc/css/GenSenRoundedTW/400">
<link rel="stylesheet" href="https://font.emtech.cc/css/GenSenRoundedTW/700">
</noscript>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent: #2F4982;   /* 凱星牙醫標題「凱星牙醫」的藍 */
  --gold:   #D1A669;   /* 下載按鈕金黃 */
  --gold-hover: #BC9459;
  --title:  #2F4982;
  --text:   #33476E;
  --muted:  #8892A8;
  --border: #CBD3E3;
  --bg:     #EAEEF6;
}

body {
  font-family: 'GenSenRoundedTW', 'Noto Serif TC', system-ui, sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 24px 48px;
  gap: 20px;
}

.app-label {
  font-family: 'GenSenRoundedTW', system-ui, sans-serif;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.08em;
}

.app-body {
  display: flex;
  gap: 44px;
  align-items: flex-start;
}

/* ── LEFT PANEL ── */
.left-panel {
  width: 288px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.tab-bar {
  display: flex;
  border: 2px solid var(--accent);
  border-radius: 8px;
  overflow: hidden;
}
.tab-btn {
  flex: 1;
  font-family: 'GenSenRoundedTW', 'Noto Serif TC', sans-serif;
  font-size: 13px;
  padding: 9px 0;
  border: none;
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.tab-btn:not(:last-child) { border-right: 2px solid var(--accent); }
.tab-btn.active { background: var(--accent); color: #fff; }
.tab-btn:not(.active):hover { background: rgba(126,143,174,0.10); }

.form-panel { display: none; flex-direction: column; gap: 11px; }
.form-panel.active { display: flex; }

.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-label {
  font-family: 'GenSenRoundedTW', system-ui, sans-serif;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.04em;
}

input[type="date"] {
  font-family: 'GenSenRoundedTW', 'Noto Serif TC', sans-serif;
  font-size: 14px;
  padding: 7px 10px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  background: #fff;
  color: var(--title);
  outline: none;
  width: 100%;
  transition: border-color 0.15s;
}
input[type="date"]:focus { border-color: var(--accent); }

/* Session checkboxes */
.session-checks {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 14px;
  padding: 6px 0;
}
.session-check {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: 'GenSenRoundedTW', 'Noto Serif TC', sans-serif;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  user-select: none;
}
.session-check input[type="checkbox"] {
  width: 15px;
  height: 15px;
  accent-color: var(--accent);
  cursor: pointer;
}

/* Dynamic date rows */
.date-rows {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.date-row {
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  background: #fff;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.date-row-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.date-row-num {
  font-family: 'GenSenRoundedTW', system-ui, sans-serif;
  font-size: 11px;
  color: var(--muted);
}
.remove-btn {
  width: 22px;
  height: 22px;
  border: 1.5px solid var(--border);
  border-radius: 4px;
  background: #fff;
  color: var(--muted);
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  flex-shrink: 0;
  transition: background 0.12s, color 0.12s;
}
.remove-btn:hover { background: #FEE2E2; color: #B91C1C; border-color: #FECACA; }

.add-row-btn {
  font-family: 'GenSenRoundedTW', 'Noto Serif TC', sans-serif;
  font-size: 13px;
  padding: 8px 0;
  background: transparent;
  color: var(--accent);
  border: 1.5px dashed var(--accent);
  border-radius: 6px;
  cursor: pointer;
  width: 100%;
  transition: background 0.15s;
}
.add-row-btn:hover { background: rgba(126,143,174,0.08); }

.divider { height: 1px; background: var(--border); }

.dl-btn {
  font-family: 'GenSenRoundedTW', 'Noto Serif TC', sans-serif;
  font-size: 14px;
  font-weight: 700;
  padding: 11px 0;
  background: var(--gold);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  width: 100%;
  transition: background 0.15s;
}
.dl-btn:hover    { background: var(--gold-hover); }
.dl-btn:disabled { background: #D8DEE9; color: var(--muted); cursor: default; }

/* ── CANVAS ── */
.canvas {
  position: relative;
  width: 600px;
  height: 600px;
  overflow: hidden;
  border-radius: 4px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.14);
  background-size: cover;
  background-position: center;
}

/* Content area – aligned to the white box in the 凱星牙醫 background (box ≈18.5%–89% of 2812px image) */
.content-area {
  position: absolute;
  top: 110px;
  left: 15%;
  right: 15%;
  height: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.tpl { display: none; flex-direction: column; align-items: center; }
.tpl.active { display: flex; }

/* Multi-day lines */
.multi-lines {
  display: flex;
  flex-direction: column;
  gap: 0px;
  align-items: center;
}
.multi-line {
  font-family: 'GenSenRoundedTW', 'Noto Serif TC', sans-serif;
  font-weight: 700;
  font-size: 28px;
  color: #606161;
  letter-spacing: 0.04em;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  max-width: 100%;
  text-align: center;
}

/* Single day */
.single-date {
  font-family: 'GenSenRoundedTW', 'Noto Serif TC', sans-serif;
  font-weight: 700;
  font-size: 28px;
  color: #606161;
  letter-spacing: 0.04em;
  text-align: center;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  max-width: 100%;
}
.single-line2,
.single-line3 {
  font-family: 'GenSenRoundedTW', 'Noto Serif TC', sans-serif;
  font-weight: 700;
  font-size: 28px;
  color: #606161;
  letter-spacing: 0.04em;
  text-align: center;
  line-height: 1.5;
  margin-top: 0px;
  white-space: pre-wrap;
  word-break: break-word;
  max-width: 100%;
}

/* Custom text input */
input[type="text"].custom-line,
textarea.custom-line {
  font-family: 'GenSenRoundedTW', 'Noto Serif TC', sans-serif;
  font-size: 14px;
  padding: 7px 10px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  background: #fff;
  color: var(--title);
  outline: none;
  width: 100%;
  transition: border-color 0.15s;
}
textarea.custom-line {
  resize: vertical;
  min-height: 56px;
  line-height: 1.4;
}
input[type="text"].custom-line:focus,
textarea.custom-line:focus { border-color: var(--accent); }

.copyright {
  align-self: flex-end;
  font-family: 'GenSenRoundedTW', system-ui, sans-serif;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.06em;
}

/* ── canvas wrapper (preview + download button stacked) ── */
.canvas-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

/* dl-btn below canvas – hidden by default, shown on mobile */
.dl-btn-below {
  display: none;
  font-family: 'GenSenRoundedTW', 'Noto Serif TC', sans-serif;
  font-size: 14px;
  font-weight: 700;
  padding: 11px 0;
  background: var(--gold);
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  width: 100%;
  transition: background 0.15s;
}
.dl-btn-below:hover    { background: var(--gold-hover); }
.dl-btn-below:disabled { background: #D8DEE9; color: var(--muted); cursor: default; }

/* ── RWD ── */
@media (max-width: 700px) {
  body {
    padding: 16px 16px 40px;
    gap: 14px;
  }

  .app-body {
    flex-direction: column;
    align-items: stretch;
    gap: 20px;
    width: 100%;
  }

  .left-panel {
    width: 100%;
  }

  /* scale the 600×600 canvas to fit mobile width */
  .canvas {
    width: 100%;
    max-width: 600px;
    aspect-ratio: 1 / 1;
    height: auto;
  }

  /* scale content-area proportionally */
  .content-area {
    top: 18.3%;   /* 110/600 */
    height: 70%;  /* 420/600 */
  }

  .multi-line,
  .single-date,
  .single-line2,
  .single-line3 {
    font-size: clamp(14px, 4.5vw, 28px);
  }

  /* show the button below the canvas on mobile */
  .dl-btn-below { display: block; }
  /* hide the one inside left-panel on mobile */
  .dl-btn-side  { display: none; }

  /* ── Form B date inputs: fix width + align left ── */
  #form-B .form-group {
    flex-direction: row;
    align-items: center;
    gap: 10px;
  }
  #form-B .form-group .form-label {
    min-width: 72px;
    flex-shrink: 0;
    text-align: left;
  }
  #form-B .form-group input[type="date"] {
    flex: 1;
    width: auto;
  }
  /* session & custom text rows stay column */
  #form-B .form-group:has(.session-checks),
  #form-B .form-group:has(.custom-line) {
    flex-direction: column;
    align-items: flex-start;
  }
}

</style>
</head>
<body>

<p class="app-label">凱星牙醫 休診公告產生器</p>

<div class="app-body">

  <!-- ════ LEFT PANEL ════ -->
  <aside class="left-panel">


        <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('A')">單日／多日</button>
      <button class="tab-btn"        onclick="switchTab('B')">多日連續</button>
    </div>

    <!-- Form A: 單日／多日不連續休診 -->
    <div class="form-panel active" id="form-A">
      <div id="date-rows" class="date-rows"></div>
      <button class="add-row-btn" onclick="addRow()">＋ 新增日期</button>
      <div class="form-group">
        <span class="form-label">自訂文字（選填）</span>
        <textarea class="custom-line" id="A-line2" rows="2" maxlength="100" placeholder="自訂說明" oninput="render()">造成不便 敬請見諒</textarea>
      </div>
    </div>

    <!-- Form B: 多日連續休診 -->
    <div class="form-panel" id="form-B">
      <div class="form-group">
        <span class="form-label">開始日期</span>
        <input type="date" id="B-start" oninput="autoEndDate(); render()">
      </div>
      <div class="form-group">
        <span class="form-label">結束日期</span>
        <input type="date" id="B-end" oninput="render()">
      </div>
      <div class="form-group">
        <span class="form-label">休診時段</span>
        <div class="session-checks" id="B-sessions">
          <label class="session-check"><input type="checkbox" value="早診" onchange="handleCheck('B',this)">早診</label>
          <label class="session-check"><input type="checkbox" value="午診" onchange="handleCheck('B',this)">午診</label>
          <label class="session-check"><input type="checkbox" value="晚診" onchange="handleCheck('B',this)">晚診</label>
          <label class="session-check"><input type="checkbox" value="全天" onchange="handleAllDay('B',this)">全天</label>
        </div>
      </div>
      <div class="form-group">
        <span class="form-label">自訂文字（選填）</span>
        <textarea class="custom-line" id="B-line2" rows="2" maxlength="100" placeholder="自訂說明" oninput="render()">造成不便 敬請見諒</textarea>
      </div>
    </div>

    <div class="divider"></div>
    <button class="dl-btn dl-btn-side" id="dl-btn" onclick="downloadPNG()">↓ 下載圖片</button>

  </aside>

  <!-- ════ CANVAS ════ -->
  <main>
    <div class="canvas-wrap">
    <div class="canvas" id="the-canvas">

      <img id="bg-img" style="display:none" alt="">

      <!-- Content: centered on canvas -->
      <div class="content-area" id="content-area">

        <!-- A: 多日 -->
        <div class="tpl active" id="tpl-A">
          <div class="multi-lines" id="pv-A-lines"></div>
          <div class="single-line3" id="pv-A-custom"></div>
        </div>

        <!-- B: 多日連續 -->
        <div class="tpl" id="tpl-B">
          <div class="single-date"  id="pv-B-range"></div>
          <div class="single-line2" id="pv-B-session"></div>
          <div class="single-line3" id="pv-B-line2"></div>
        </div>


      </div>
    </div>
    <footer class="copyright">AlleyPin | Design</footer>
    <button class="dl-btn-below" id="dl-btn-below" onclick="downloadPNG()">↓ 下載圖片</button>
    </div><!-- /canvas-wrap -->
  </main>

</div>

<script>
/* ──────────────────────────────────────────────
   Constants & State
────────────────────────────────────────────── */
const WEEKDAYS = ['日','一','二','三','四','五','六'];
const SESSION_ORDER = ['早診','午診','晚診'];
let current = 'A';
let rowCount = 0;

const $ = id => document.getElementById(id);
const val = id => $(id)?.value ?? '';

/* ──────────────────────────────────────────────
   Date helpers
────────────────────────────────────────────── */
function fmtDate(str) {
  if (!str) return '';
  const [y, m, d] = str.split('-').map(Number);
  const wd = new Date(y, m - 1, d).getDay();
  return `${m}/${String(d).padStart(2,'0')}(${WEEKDAYS[wd]})`;
}

function localDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function autoEndDate() {
  const s = val('B-start');
  if (s) $('B-end').value = addDays(s, 1);
}

function addDays(str, n) {
  const d = new Date(str + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return localDateStr(d);
}

/* ──────────────────────────────────────────────
   Session helpers
────────────────────────────────────────────── */
function getCheckedSessions(containerId) {
  const el = $(containerId);
  if (!el) return [];
  const all = el.querySelector('input[value="全天"]');
  if (all?.checked) return ['全天'];
  return SESSION_ORDER.filter(s => {
    const cb = Array.from(el.querySelectorAll('input[type="checkbox"]')).find(c => c.value === s);
    return cb?.checked;
  });
}

function formatSessions(sessions) {
  if (!sessions.length) return '';
  if (sessions.includes('全天')) return '全天';
  return sessions.join('、');
}

function handleCheck(formId, cb) {
  // If any partial session checked, uncheck 全天
  const container = formId === 'B' ? $('B-sessions') : cb.closest('.session-checks');
  if (cb.value !== '全天' && cb.checked) {
    const allDayCb = container.querySelector('input[value="全天"]');
    if (allDayCb) allDayCb.checked = false;
  }
  // If 早診／午診／晚診 all checked, that IS 全天 — collapse into it
  const boxes = Array.from(container.querySelectorAll('input[type="checkbox"]'));
  const allPartialChecked = ['早診','午診','晚診'].every(v =>
    boxes.find(c => c.value === v)?.checked
  );
  if (allPartialChecked) {
    boxes.forEach(c => { c.checked = (c.value === '全天'); });
  }
  render();
}

function handleAllDay(formId, cb) {
  const container = formId === 'B' ? $('B-sessions') : cb.closest('.session-checks');
  if (cb.checked) {
    container.querySelectorAll('input[type="checkbox"]').forEach(c => {
      if (c.value !== '全天') c.checked = false;
    });
  }
  render();
}

/* ──────────────────────────────────────────────
   Dynamic row management (Template A)
────────────────────────────────────────────── */
function addRow() {
  const container = $('date-rows');
  if (container.children.length >= 4) return;
  const idx = ++rowCount;
  const dateVal = idx === 1 ? localDateStr(new Date()) : '';

  const div = document.createElement('div');
  div.className = 'date-row';
  div.id = `row-${idx}`;
  div.innerHTML = `
    <div class="date-row-header">
      <span class="date-row-num">日期 ${container.children.length + 1}</span>
      <button class="remove-btn" onclick="removeRow(${idx})" title="刪除">×</button>
    </div>
    <div class="form-group">
      <input type="date" id="row-date-${idx}" value="${dateVal}" oninput="render()">
    </div>
    <div class="session-checks" id="row-sessions-${idx}">
      <label class="session-check"><input type="checkbox" value="早診" onchange="handleCheck('row-${idx}',this)">早診</label>
      <label class="session-check"><input type="checkbox" value="午診" onchange="handleCheck('row-${idx}',this)">午診</label>
      <label class="session-check"><input type="checkbox" value="晚診" onchange="handleCheck('row-${idx}',this)">晚診</label>
      <label class="session-check"><input type="checkbox" value="全天" onchange="handleAllDay('row-${idx}',this)">全天</label>
    </div>`;
  container.appendChild(div);
  renumberRows();
  render();
}

function removeRow(idx) {
  const container = $('date-rows');
  if (container.children.length <= 1) return;
  const row = $(`row-${idx}`);
  if (row) row.remove();
  renumberRows();
  render();
}

function renumberRows() {
  const container = $('date-rows');
  Array.from(container.children).forEach((row, i) => {
    const numEl = row.querySelector('.date-row-num');
    if (numEl) numEl.textContent = `日期 ${i + 1}`;
  });
}

/* ──────────────────────────────────────────────
   Render preview
────────────────────────────────────────────── */
function render() {
  if (current === 'A') renderA();
  else renderB();
}

function renderA() {
  const linesEl = $('pv-A-lines');
  linesEl.innerHTML = '';
  const rows = $('date-rows').querySelectorAll('.date-row');
  rows.forEach(row => {
    const rowId = row.id;
    const dateInput = row.querySelector('input[type="date"]');
    const dateStr = dateInput?.value || '';
    const sessions = getCheckedSessions(`row-sessions-${rowId.replace('row-','')}`);
    const dateFmt = fmtDate(dateStr);
    const sessionFmt = formatSessions(sessions);
    const text = dateFmt
      ? (sessionFmt ? `${dateFmt}　${sessionFmt}休診` : dateFmt)
      : '';
    const lineDiv = document.createElement('div');
    lineDiv.className = 'multi-line';
    lineDiv.textContent = text;
    linesEl.appendChild(lineDiv);
  });
  $('pv-A-custom').textContent = val('A-line2');
}

function renderB() {
  const startStr = val('B-start');
  const endStr   = val('B-end');
  const startFmt = fmtDate(startStr);
  const endFmt   = fmtDate(endStr);
  $('pv-B-range').textContent = startFmt && endFmt
    ? `${startFmt} 〜 ${endFmt}`
    : (startFmt || endFmt || '');
  const sessions = getCheckedSessions('B-sessions');
  const sessionFmt = formatSessions(sessions);
  $('pv-B-session').textContent = sessionFmt ? sessionFmt + '休診' : '';
  $('pv-B-line2').textContent = val('B-line2');
}

/* ──────────────────────────────────────────────
   Tab switching
────────────────────────────────────────────── */
function switchTab(name) {
  current = name;
  document.querySelectorAll('.tab-btn').forEach((btn, i) =>
    btn.classList.toggle('active', ['A','B'][i] === name)
  );
  ['A','B'].forEach(id => {
    $('form-' + id)?.classList.toggle('active', id === name);
    $('tpl-'  + id)?.classList.toggle('active', id === name);
  });
  render();
}

/* ──────────────────────────────────────────────
   JPEG DPI injection (sets the JFIF density fields)
────────────────────────────────────────────── */
function injectDPI(jpegBlob, dpi) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const bytes = new Uint8Array(e.target.result);
      // Canvas-emitted JPEGs start with FFD8 FFE0 (JFIF APP0) as the first segment
      if (bytes[2] === 0xFF && bytes[3] === 0xE0) {
        bytes[13] = 1; // density units = dots per inch
        bytes[14] = (dpi >> 8) & 0xFF;
        bytes[15] = dpi & 0xFF;
        bytes[16] = (dpi >> 8) & 0xFF;
        bytes[17] = dpi & 0xFF;
      }
      resolve(new Blob([bytes], { type: 'image/jpeg' }));
    };
    reader.readAsArrayBuffer(jpegBlob);
  });
}

/* ──────────────────────────────────────────────
   Download image (JPEG)
────────────────────────────────────────────── */
function setDlBtns(text, disabled) {
  [$('dl-btn'), $('dl-btn-below')].forEach(b => { if (b) { b.textContent = text; b.disabled = disabled; } });
}

async function downloadPNG() {
  setDlBtns('產生中…', true);
  try {
    const SIZE = 2048;

    await document.fonts.ready;

    const oc  = document.createElement('canvas');
    oc.width  = oc.height = SIZE;
    const ctx = oc.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    // Draw background
    ctx.drawImage($('bg-img'), 0, 0, SIZE, SIZE);

    const cvsRect = $('the-canvas').getBoundingClientRect();
    // Dynamic scale: convert from actual screen pixels to 1080px output
    const SCALE = SIZE / cvsRect.width;
    // Font scale: always relative to the original 600px design size
    const FS_SCALE = SIZE / 600;

    /* Draw text from a DOM element */
    function drawEl(id, color, fsPx, weight, lhRatio = 1.3, align = 'center') {
      const el = $(id);
      if (!el) return;
      const text = el.textContent.trim();
      if (!text) return;
      const r = el.getBoundingClientRect();
      ctx.fillStyle    = color;
      ctx.font         = `${weight} ${fsPx * FS_SCALE}px 'GenSenRoundedTW', 'Noto Serif TC', sans-serif`;
      ctx.textAlign    = align;
      ctx.textBaseline = 'top';
      const px = align === 'center'
        ? (r.left - cvsRect.left + r.width / 2) * SCALE
        : (r.left - cvsRect.left) * SCALE;
      // r.height is one line's rendered height (fontSize * lhRatio in screen px).
      // The visual glyph sits in the middle of that; offset down by the top half-leading.
      const topLeading = r.height * (1 - 1 / lhRatio) / 2;
      const py   = (r.top - cvsRect.top + topLeading) * SCALE;
      const lh   = fsPx * lhRatio * FS_SCALE;
      const maxW = r.width * SCALE;
      function wrapLines(txt) {
        const out = [];
        for (const para of txt.split('\n')) {
          if (ctx.measureText(para).width <= maxW) { out.push(para); continue; }
          let line = '';
          for (const ch of para) {
            const test = line + ch;
            if (ctx.measureText(test).width > maxW && line) { out.push(line); line = ch; }
            else line = test;
          }
          if (line) out.push(line);
        }
        return out;
      }
      wrapLines(text).forEach((ln, i) => ctx.fillText(ln, px, py + i * lh));
    }

    /* Template content */
    const FS = 28;
    if (current === 'A') {
      const lines = $('pv-A-lines').querySelectorAll('.multi-line');
      lines.forEach(lineEl => {
        const text = lineEl.textContent.trim();
        if (!text) return;
        const lr = lineEl.getBoundingClientRect();
        ctx.fillStyle    = '#606161';
        ctx.font         = `700 ${FS * FS_SCALE}px 'GenSenRoundedTW', 'Noto Serif TC', sans-serif`;
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'top';
        const topLeadingA = lr.height * (1 - 1 / 1.5) / 2;
        ctx.fillText(text,
          (lr.left - cvsRect.left + lr.width / 2) * SCALE,
          (lr.top  - cvsRect.top + topLeadingA) * SCALE
        );
      });
      drawEl('pv-A-custom', '#606161', FS, '700', 1.5);
    } else {
      drawEl('pv-B-range',   '#606161', FS, '700', 1.5);
      drawEl('pv-B-session', '#606161', FS, '700', 1.5);
      drawEl('pv-B-line2',   '#606161', FS, '700', 1.5);
    }

    /* Export */
    const firstDate = current === 'A'
      ? $('date-rows')?.querySelector('input[type="date"]')?.value
      : val('B-start');
    const dateStr  = firstDate ? firstDate.replace(/-/g,'') : '日期';
    const filename = `凱星-${dateStr}-休診公告.jpg`;

    await new Promise(res => oc.toBlob(async rawBlob => {
      const dpiBlob = await injectDPI(rawBlob, 150);
      const a = document.createElement('a');
      a.download = filename;
      a.href = URL.createObjectURL(dpiBlob);
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      res();
    }, 'image/jpeg', 0.9));

  } catch (err) {
    console.error(err);
    alert('下載失敗：' + err.message);
  } finally {
    setDlBtns('↓ 下載圖片', false);
  }
}
